spring:
  datasource:
    # Using H2 in-memory (no Cloud SQL needed — data resets on container restart)
    url: jdbc:h2:mem:quiz_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: quiz_user
    password: quiz_pass
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false   # Hibernate manages H2 schema

logging:
  level:
    root: WARN
    org.java.assesment: INFO
